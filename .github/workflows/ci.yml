name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, typecheck, lint, and database regressions
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tech_store_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d tech_store_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/tech_store_test
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/tech_store_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tech_store_test
      AUTH_SECRET: isolated-ci-authentication-secret-32-characters
      AUTH_TRUST_HOST: 'true'
      APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and generate Prisma client
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run application unit tests
        run: npm test
      - name: Apply migrations to isolated PostgreSQL
        run: npm run db:deploy
      - name: Production build
        run: npm run build
      - name: Database and HTTP regression tests
        run: npm run test:db
